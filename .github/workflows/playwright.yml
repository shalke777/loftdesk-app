  name: Playwright Smoke

on:
  push:
    branches: [ "main", "master" ]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run smoke tests
        env:
          PW_BASE_URL: ${{ secrets.PW_BASE_URL }}
          LOFT_EMAIL: ${{ secrets.LOFT_EMAIL }}
          LOFT_PASS: ${{ secrets.LOFT_PASS }}
          LOFT_EMAIL_A: ${{ secrets.LOFT_EMAIL_A }}
          LOFT_PASS_A: ${{ secrets.LOFT_PASS_A }}
          LOFT_EMAIL_B: ${{ secrets.LOFT_EMAIL_B }}
          LOFT_PASS_B: ${{ secrets.LOFT_PASS_B }}
        run: npm run test:smoke

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload test-results (traces/videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
          retention-days: 14
